name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Sample data is deterministic across platforms
        shell: bash
        run: |
          dotnet run --configuration Release --no-build --project samples/generator
          cd samples/ContosoPII/data && sha256sum -c ../data.sha256

      - name: Test (unit + end-to-end on the sample)
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Command line smoke test
        shell: bash
        run: |
          dotnet run --configuration Release --no-build --project src/PbiTwin.Cli -- \
            --pbip samples/ContosoPII --csv samples/ContosoPII/data --out "$RUNNER_TEMP/Twin" --rename semantic --seed CI
          test -f "$RUNNER_TEMP/Twin/Twin.pbip" && test -f "$RUNNER_TEMP/Twin.codebook.json"
