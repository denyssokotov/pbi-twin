name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Sample data is deterministic across platforms
        shell: bash
        run: |
          dotnet run --configuration Release --no-build --project samples/generator
          cd samples/ContosoPII/data && sha256sum -c ../data.sha256

      - name: Test (unit + end-to-end on the sample)
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Command line smoke test
        shell: bash
        run: |
          dotnet run --configuration Release --no-build --project src/PbiTwin.Cli -- \
            --pbip samples/ContosoPII --csv samples/ContosoPII/data --out "$RUNNER_TEMP/Twin" --rename semantic --seed CI
          test -f "$RUNNER_TEMP/Twin/Twin.pbip" && test -f "$RUNNER_TEMP/Twin.codebook.json"
          dotnet run --configuration Release --no-build --project src/PbiTwin.Cli -- \
            scan --pbip samples/ContosoPII --csv samples/ContosoPII/data | grep -q "DimCustomer\[Email\]"

      - name: Command line refuses mistakes
        shell: bash
        run: |
          cli() { dotnet run --configuration Release --no-build --project src/PbiTwin.Cli -- "$@"; }
          base="--pbip samples/ContosoPII --csv samples/ContosoPII/data"
          # Each of these must fail with exit code 1 (a typo must never silently change what a run does).
          for bad in "--rennme neutral" "--rename bogus" "--rows 0" "--noise -5" "--port 1" "--seed"; do
            if cli $base --out "$RUNNER_TEMP/Bad" $bad; then echo "accepted: $bad"; exit 1; fi
          done
          if cli $base --out samples/ContosoPII/inside; then echo "accepted an output inside the project"; exit 1; fi
          test ! -e samples/ContosoPII/inside
